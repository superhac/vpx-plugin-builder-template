name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # cmake_args: extra configure flags per target. On Windows, -A picks the
        # architecture; CMake then uses the matching plugin.cfg entry
        # (windows.x64 -> plugin-<name>64.dll, windows.x86 -> plugin-<name>.dll).
        include:
          - { slug: linux-x64,       runner: ubuntu-22.04,     cmake_args: '' }
          - { slug: linux-aarch64,   runner: ubuntu-22.04-arm, cmake_args: '' }
          - { slug: windows-x64,     runner: windows-latest,   cmake_args: '-A x64' }
          - { slug: windows-x86,     runner: windows-latest,   cmake_args: '-A Win32' }
          - { slug: macos-universal, runner: macos-latest,     cmake_args: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Artifact/zip names come from the `id` in plugin.cfg (lowercased).
      - name: Read plugin id
        run: |
          id="$(sed -n 's/^id[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' plugin.cfg)"
          echo "PLUGIN_SLUG=$(echo "$id" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Install your plugin's third-party dependencies here, per platform.
      # Each runner builds natively, so install the library for that OS/arch.
      # Anything the plugin loads at runtime must also end up in staging/<id>/
      # (see "Dependencies" in the README).
      - name: Install dependencies
        run: |
          case "${{ runner.os }}" in
            Linux)
              : # sudo apt-get update && sudo apt-get install -y libfoo-dev
              ;;
            macOS)
              : # brew install foo   (Homebrew bottles are single-arch: see README)
              ;;
            Windows)
              : # vcpkg install foo:${{ matrix.slug == 'windows-x86' && 'x86' || 'x64' }}-windows-static
              ;;
          esac

      # Build and stage the ready-to-ship folder (staging/<PLUGIN_ID>/).
      # macOS builds a universal (x86_64+arm64) dylib, which the CMakeLists
      # does automatically when CMAKE_OSX_ARCHITECTURES is unset.
      - name: Build & stage
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}
          cmake --build build --config Release
          cmake --install build --prefix staging --config Release

      # Upload the FOLDER, not a pre-made zip. upload-artifact always wraps its
      # input in one zip on download — handing it a .zip would nest zip-in-zip.
      # The downloadable artifact is a single <id>-<slug>.zip containing
      # the <PLUGIN_ID>/ folder.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLUGIN_SLUG }}-${{ matrix.slug }}
          path: staging/
          if-no-files-found: error

  # On a version tag (v1.2.3), gather every platform folder and zip each into a
  # single per-platform archive attached to a GitHub Release — the files your
  # plugin store serves.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Each artifact extracts to artifacts/<id>-<slug>/<PLUGIN_ID>/...
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Zip each platform
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            slug="$(basename "$dir")"          # e.g. myplugin-linux-x64
            ( cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/${slug}.zip" . )
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
