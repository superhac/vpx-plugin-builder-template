name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.slug }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { slug: linux-x64,       runner: ubuntu-22.04 }
          - { slug: linux-aarch64,   runner: ubuntu-22.04-arm }
          - { slug: windows-x64,     runner: windows-latest }
          - { slug: macos-universal, runner: macos-14 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Build and stage the ready-to-ship folder (staging/<PLUGIN_ID>/).
      # macOS builds a universal (x86_64+arm64) dylib, which the CMakeLists
      # does automatically when CMAKE_OSX_ARCHITECTURES is unset.
      - name: Build & stage
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          cmake --install build --prefix staging --config Release

      # Upload the FOLDER, not a pre-made zip. upload-artifact always wraps its
      # input in one zip on download — handing it a .zip would nest zip-in-zip.
      # The downloadable artifact is a single myplugin-<slug>.zip containing
      # the <PLUGIN_ID>/ folder.
      - uses: actions/upload-artifact@v5
        with:
          name: myplugin-${{ matrix.slug }}
          path: staging/
          if-no-files-found: error

  # On a version tag (v1.2.3), gather every platform folder and zip each into a
  # single per-platform archive attached to a GitHub Release — the files your
  # plugin store serves.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Each artifact extracts to artifacts/myplugin-<slug>/<PLUGIN_ID>/...
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Zip each platform
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            slug="$(basename "$dir")"          # e.g. myplugin-linux-x64
            ( cd "$dir" && zip -r "$GITHUB_WORKSPACE/release/${slug}.zip" . )
          done
          ls -l release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
